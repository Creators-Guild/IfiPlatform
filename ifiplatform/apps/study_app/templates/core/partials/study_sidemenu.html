{% load static %}
{% load i18n %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'css/06_components/sidemenu.css' %}">
{% endblock %}

<div class= "sidemenu">
    <button type="button" class="sidemenu-close" aria-label="{% trans "Close menu" %}">&times;</button>
    <div class="sidemenu-header" role="button" tabindex="0" aria-expanded="false">
        <img class="icon" src="{% static 'images/icons/black_menu_icon.png' %}" alt="{% trans "menu" %}">
        <span class="icon-text">{% trans "Menu" %}</span>
    </div>

    <div class= "sidemenu-item">
        <a class="sidemenu-option" href="">{% trans "Studytools" %}</a>
        <div class="drop-content">
            <a class="drop-option drop-option--all" href="">{% trans "All" %}</a>
            <a href="">
                {% trans "Flashcards" %}
            </a>
            <a href="">
                {% trans "Multiplechoice" %}
            </a>
        </div>
    </div>
</div>
<script src="{% static 'js/dropdown_menu.js' %}" defer></script>
