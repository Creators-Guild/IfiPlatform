{% extends 'ifi_base.html' %}

{% block title %} User Registration {% endblock %}

{% block content %}
    <h1>User Registration</h1>
    <form class="form-with-validation" action="{% url 'signin' %}" method="post">
        {% csrf_token %}
        {{form}}
        <button class="form-submit">Sign In</button>
    </form>
    <a href="{% url 'login' %}">Already an user? Log in here</a>
{% endblock %}
