{% load i18n static %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'css/styles/neon_style/01_objects/newsbar_layout.css' %}">
  <link rel="stylesheet" href="{% static 'css/styles/neon_style/02_components/newsbar_item.css' %}">
{% endblock %}

<h2 class="newsbar-heading">{% trans "Suggested News" %}</h2>
<div class="newsbar-layout bottom-content">
    {% for article in news_articles %}
        {% include "info_articles/partials/article_card.html" with article=article %}
    {% empty %}
        <p>No news yet or something is broken ;_;</p>
    {% endfor %}
</div>
