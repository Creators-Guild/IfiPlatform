{% load i18n wagtailcore_tags %}

{% if page %}
    <nav aria-label="{% trans 'Breadcrumb' %}">
        {% with parent=page.get_parent %}
            <a href="{% pageurl parent %}" class="back-to" aria-label="{% trans 'Back' %}">
                <span aria-hidden="true">←</span>
            </a>
            <span aria-hidden="true">  </span>
        {% endwith %}

        {% for ancestor in page.get_ancestors.live %}
            {% if not ancestor.is_root %}
                <a class="back-to" href="{% pageurl ancestor %}">{{ ancestor.title }}</a>
                <span aria-hidden="true">/</span>
            {% endif %}
        {% endfor %}

        <span class="current" aria-current="page">{{ page.title }}</span>
    </nav>
{% else %}
    <a class="back-to" href="{% url 'ifi_home' %}">{% trans "Back to Homepage" %}</a>
{% endif %}
