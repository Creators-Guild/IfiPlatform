{% load static %}
<a href="{% url 'ifi_wiki_article' meta.article.id %}" class="grid-item box">
    {% if meta.article.image_name %}
        <img src="{% static 'images/news/' %}{{ meta.article.image_name }}" 
             alt="{{ meta.article.title }}">
    {% else %}
        <!-- simple placeholder if no image -->
        <img src="{% static 'images/news/IfiBygg.jpg' %}" 
             alt="{{ meta.article.title }}">
    {% endif %}
    <h3>{{ meta.article.title }}</h3>
    <p>{{ meta.description }}</p>
</a>
