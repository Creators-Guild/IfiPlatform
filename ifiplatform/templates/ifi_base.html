{% load i18n %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %} Ifi Platform {% endblock %}
    </title>
    <link rel="stylesheet" href="{% static 'css\styles\neon_style\base.css' %}">
    {% block extra_head %}<!-- addtional css here -->{% endblock extra_head %}
</head>
<body>
    <div class="page-layout">
        <div class= "topheader-content">
            {% include "partials/select_language.html" %}
            {% include "partials/top_header.html" %}
        </div>
        <main class="page-content">
            {% block content %}
            <!-- default content, can be empty -->
            {% endblock %}
        </main>
        <div class="bottombar-content">
            {% include "partials/bottom_header.html" %}
        </div>
    </div>
</body>
</html>
