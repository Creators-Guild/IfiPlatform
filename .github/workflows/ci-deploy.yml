name: CI & Deploy
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # 01:00 UTC daily -- batches whatever merged to main since the last run
    # into one nightly deploy instead of deploying on every push. Adjust
    # the hour here if 01:00 UTC isn't the right window.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Deploy even if tests/lint fail (emergency override)"
        type: boolean
        default: false
      skip_tests:
        description: "Don't run the test suite at all this run (e.g. re-running back-to-back with no code changes)"
        type: boolean
        default: false
      skip_lint:
        description: "Don't run pylint at all this run"
        type: boolean
        default: false
      skip_countdown:
        description: "Skip the 10-minute visitor warning countdown before restarting (independent of force_deploy)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    # Only a manual dispatch can skip this at all -- push/pull_request/
    # schedule never carry skip_tests, so they're unaffected.
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_tests != 'true'
    env:
      DJANGO_SECRET_KEY: dummy-secret-key-for-ci
      DEBUG: "True"
    strategy: # separate parallel jobs, one per Python version
      max-parallel: 4
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Tests
        run: |
          # Explicit app labels, not bare `test` -- this project's apps live
          # grouped under ifiplatform/apps/, and Django's filesystem-based
          # test discovery silently skips anything nested under a directory
          # without an __init__.py, so a bare `manage.py test` would only
          # run core_app's tests. Add new apps here too.
          python ifiplatform/manage.py test core_app ifi_home_app account_app study_app yourpage_app

  lint:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_lint != 'true'
    env:
      DJANGO_SECRET_KEY: dummy-secret-key-for-ci
      DEBUG: "True"
    strategy:
      matrix:
        # Django 6.0 supports Python 3.12, 3.13, and 3.14
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint pylint-django
      - name: Analysing the code with pylint
        run: |
          # Ignore auto-generated migration files
          # Fails only if code is below 7/10 score
          pylint --load-plugins pylint_django \
                 --django-settings-module=ifiplatform_project.settings \
                 --ignore-paths=ifiplatform/.*/migrations \
                 --fail-under=7 \
                 $(git ls-files '*.py')

  deploy:
    needs: [test, lint]
    # A plain push to main no longer deploys directly -- it still runs
    # test+lint above for early feedback, but actually shipping happens:
    #   - on the nightly schedule trigger, once test+lint both pass against
    #     whatever is on main at that time (batches same-day merges), or
    #   - on a manual workflow_dispatch run ("Run workflow" in the Actions
    #     tab), either safely (still requires test+lint to pass, or to have
    #     been explicitly skipped via skip_tests/skip_lint -- see below) or
    #     with force_deploy checked to bypass that check entirely
    #     (emergency override).
    # `always()` is required here because a failed (or, now, skipped)
    # `needs` job would otherwise skip this job before its own `if` is even
    # evaluated.
    #
    # The `skip_tests == 'true' || ... == 'success'` pairs below treat a
    # *skipped* job the same as a passing one, but only when that skip was
    # actually requested -- schedule/push/pull_request never set those
    # inputs at all, so this never accidentally lets an unrelated skip
    # through.
    if: >
      always() &&
      (
        (github.event_name == 'schedule' && needs.test.result == 'success' && needs.lint.result == 'success')
        ||
        (github.event_name == 'workflow_dispatch' && (
          github.event.inputs.force_deploy == 'true'
          ||
          (
            (github.event.inputs.skip_tests == 'true' || needs.test.result == 'success')
            &&
            (github.event.inputs.skip_lint == 'true' || needs.lint.result == 'success')
          )
        ))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          SKIP_COUNTDOWN: ${{ github.event.inputs.skip_countdown }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          envs: SKIP_COUNTDOWN
          # appleboy/ssh-action defaults command_timeout to 10m -- the
          # visitor-warning countdown below already sleeps for a full 10
          # minutes by itself (skip_countdown aside), so the two together
          # were guaranteed to hit this timeout before ever reaching git
          # reset/migrate/collectstatic/restart. 20m covers the 10-minute
          # sleep plus the actual deploy work with room to spare.
          command_timeout: 20m
          script: |
            cd /home/ubuntu/IfiPlatform
            source venv/bin/activate
            # Warn visitors before restarting -- announce_deploy runs against
            # whatever code is *currently* deployed (this run's git reset
            # hasn't happened yet), so it's the still-live gunicorn workers
            # that actually render the countdown banner for the full window.
            # Only skipped when skip_countdown was explicitly set on a manual
            # dispatch; the nightly schedule trigger (no inputs at all) and a
            # plain manual run always get it. Independent of force_deploy --
            # bypassing failing tests/lint doesn't imply bypassing the
            # visitor warning too.
            #
            # The `if ... ; then ... else ...` here (rather than a bare
            # command) is deliberate: script_stop is on, so an unhandled
            # failure would abort the whole deploy. announce_deploy not
            # existing yet on whatever's currently deployed (true the very
            # first time this feature ships -- see announce_deploy's own
            # docstring) must not block deploying the fix for that; it
            # should just skip the warning for this one run instead.
            if [ "$SKIP_COUNTDOWN" != "true" ]; then
              cd ifiplatform
              if python manage.py announce_deploy --minutes 10; then
                cd ..
                sleep 600
              else
                echo "announce_deploy unavailable on the currently-deployed code -- skipping the warning countdown for this run."
                cd ..
              fi
            fi
            git fetch origin main
            git reset --hard origin/main
            source venv/bin/activate
            pip install -r requirements.txt
            cd ifiplatform
            python manage.py migrate
            python manage.py collectstatic --noinput --clear
            sudo systemctl restart gunicorn
            # After the restart (not before) so nothing repopulates it with
            # a value computed under the old code -- see clear_cache's own
            # docstring for the site-root-paths staleness bug this guards
            # against (every Page.url silently going None after a deploy).
            python manage.py clear_cache
            # Clears the banner immediately rather than waiting for its own
            # timeout to eventually expire -- deploy_notice.js reloads each
            # visitor's page shortly after its countdown hits zero, and by
            # then the restart above has already completed, so this makes
            # sure that reload actually lands on a banner-free page.
            python manage.py announce_deploy --clear
