name: CI & Deploy
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Deploy even if tests/lint fail (emergency override)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: dummy-secret-key-for-ci
      DEBUG: "True"
    strategy: # separate parallel jobs, one per Python version
      max-parallel: 4
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Tests
        run: |
          python ifiplatform/manage.py test

  lint:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: dummy-secret-key-for-ci
      DEBUG: "True"
    strategy:
      matrix:
        # Django 6.0 supports Python 3.12, 3.13, and 3.14
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint pylint-django
      - name: Analysing the code with pylint
        run: |
          # Ignore auto-generated migration files
          # Fails only if code is below 7/10 score
          pylint --load-plugins pylint_django \
                 --django-settings-module=ifiplatform_project.settings \
                 --ignore-paths=ifiplatform/.*/migrations \
                 --fail-under=7 \
                 $(git ls-files '*.py')

  deploy:
    needs: [test, lint]
    # Runs on a real push to main once test+lint both pass, OR on a manual
    # workflow_dispatch run with force_deploy checked (emergency override --
    # `always()` is required here because a failed `needs` job would
    # otherwise skip this job before its own `if` is even evaluated).
    if: >
      always() &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.result == 'success' && needs.lint.result == 'success')
        ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.force_deploy == 'true')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd /home/ubuntu/IfiPlatform
            git fetch origin main
            git reset --hard origin/main
            source venv/bin/activate
            pip install -r requirements.txt
            cd ifiplatform
            python manage.py migrate
            python manage.py collectstatic --noinput --clear
            sudo systemctl restart gunicorn
