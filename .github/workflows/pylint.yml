name: Pylint
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: dummy-secret-key-for-ci
    strategy:
      matrix:
        # Django 6.0 supports Python 3.12, 3.13, and 3.14
        python-version: ["3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        # understands djangocode as well
        python -m pip install --upgrade pip
        pip install pylint pylint-django
        pip install -r requirements.txt
    - name: Analysing the code with pylint
      run: |
        # Ignore auto-generated migration files
        # Fails only if code is below 7/10 score
        pylint --load-plugins pylint_django \
               --django-settings-module=ifiplatform_project.settings \
               --ignore-paths=ifiplatform/.*/migrations \
               --fail-under=7 \
               $(git ls-files '*.py')
